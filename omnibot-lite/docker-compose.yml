services:
  omnibot-lite:
    build: .
    container_name: omnibot-lite
    ports:
      # 127.0.0.1:8000 sur l'hôte — volontairement NON exposé au LAN (le hub n'a
      # pas d'authentification). Accès distant via Tailscale :
      #   tailscale serve --bg --https=11443 http://127.0.0.1:8000
      - "127.0.0.1:8000:8080"
    volumes:
      - ./data:/data
    environment:
      # Valeurs par défaut de la config LLM (modifiables aussi via l'UI, Règlages du hub).
      OMNIBOT_LLM_BASE_URL: ${OMNIBOT_LLM_BASE_URL:-}
      OMNIBOT_LLM_MODEL: ${OMNIBOT_LLM_MODEL:-}
      OMNIBOT_LLM_API_KEY: ${OMNIBOT_LLM_API_KEY:-}
      # Recherche web des bots (outil web_search). Vide = désactivé.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    restart: unless-stopped
